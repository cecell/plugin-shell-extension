# Builds the DLL and the installer on a clean GitHub runner, publishes their
# SHA-256 hashes, and attaches signed build provenance, so a downloaded
# installer can be traced back to this commit and this workflow run.
#
#   push to main / pull request / manual run -> build + "PluginShellExtension" artifact
#
# Releases are not built from tags. A release publishes the artifact of an
# earlier run unchanged, so the released files are byte for byte the ones
# that run hashed (and that were scanned): rebuilding would change the hashes.
#
# Verify a download:  gh attestation verify <file> --repo cecell/wham-asset-manager
# (for runs since the repository became public; the SHA-256 list is always produced.)
#
# After the upload, the DLL and the installer are submitted to VirusTotal
# (secret VIRUSTOTAL_API_KEY) and the results go in the run summary and a
# separate "virustotal-report" artifact. The scan never fails the build.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write       # sign the build provenance
  attestations: write

jobs:
  build:
    runs-on: windows-2025
    env:
      # Same toolset as local builds (see build.cmd).
      MSVC_TOOLSET: "14.44"
      # Inno Setup, pinned to the official release and its SHA-256.
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    steps:
      - uses: actions/checkout@v5

      - name: Install Inno Setup (verified)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup installer hash mismatch: $hash" }
          Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS' -Wait
          if (-not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) { throw "ISCC.exe not found after install" }

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=%MSVC_TOOLSET% || exit /b 1
          cl 2>&1 | findstr /C:"Version"
          cmake --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build || exit /b 1

      - name: Hash
        id: hash
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force dist
          Copy-Item build\bin\PluginShellExtension.dll, build\WHAM-*-setup.exe $dist
          $lines = Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # LF line endings, so "sha256sum -c SHA256SUMS.txt" works anywhere.
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          "## SHA-256" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $lines >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          $lines

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PluginShellExtension.dll
            dist/WHAM-*-setup.exe

      - uses: actions/upload-artifact@v5
        with:
          name: PluginShellExtension
          path: dist/
          if-no-files-found: error

      - name: VirusTotal scan
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        shell: pwsh
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VT_KEY) { "VirusTotal: no API key, skipped." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $headers = @{ 'x-apikey' = $env:VT_KEY.Trim() }
          $api = 'https://www.virustotal.com/api/v3'
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.dll', '.exe' } | Sort-Object Name
          $scans = foreach ($f in $files) {
            $id = (Invoke-RestMethod -Method Post "$api/files" -Headers $headers -Form @{ file = $f }).data.id
            [pscustomobject]@{ File = $f.Name; Sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); Id = $id; Analysis = $null }
          }
          # Wait for each analysis (up to 20 minutes in all).
          $deadline = (Get-Date).AddMinutes(20)
          while (($scans | Where-Object { -not $_.Analysis }) -and (Get-Date) -lt $deadline) {
            Start-Sleep 30
            foreach ($s in $scans | Where-Object { -not $_.Analysis }) {
              $a = (Invoke-RestMethod "$api/analyses/$($s.Id)" -Headers $headers).data.attributes
              if ($a.status -eq 'completed') { $s.Analysis = $a }
            }
          }
          $md = @('## VirusTotal', '', '| File | Detections | Report |', '|---|---|---|')
          $details = @()
          foreach ($s in $scans) {
            $link = "https://www.virustotal.com/gui/file/$($s.Sha)"
            if (-not $s.Analysis) { $md += "| $($s.File) | still running | [report]($link) |"; continue }
            $st = $s.Analysis.stats
            $flagged = $st.malicious + $st.suspicious
            $total = $st.malicious + $st.suspicious + $st.undetected + $st.harmless
            $md += "| $($s.File) | **$flagged** / $total | [report]($link) |"
            $hits = $s.Analysis.results.PSObject.Properties.Value | Where-Object { $_.category -in 'malicious', 'suspicious' }
            foreach ($h in $hits | Sort-Object engine_name) { $details += "- $($s.File): $($h.engine_name): $($h.result) ($($h.category))" }
          }
          if ($details) { $md += '', '### Detections', '' ; $md += $details }
          $md += '', "Commit: $env:GITHUB_SHA"
          $md -join "`n" | Tee-Object -FilePath vt-report.md
          $md -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload VirusTotal report
        if: ${{ github.event_name != 'pull_request' && hashFiles('vt-report.md') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: virustotal-report
          path: vt-report.md
